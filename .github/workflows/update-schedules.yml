name: Update Course Schedules

on:
  schedule:
    # Every 4 hours normally
    - cron: '0 */4 * * *'
    # Every 5 minutes during registration week: April 12-17 (all hours, all days)
    # Registration opens 9:30 PM EDT = 1:30 AM UTC the next day:
    #   Seniors Apr 12 -> 1:30 AM UTC Apr 13
    #   Juniors Apr 13 -> 1:30 AM UTC Apr 14
    #   Sophomores Apr 14 -> 1:30 AM UTC Apr 15
    #   First Years Apr 15 -> 1:30 AM UTC Apr 16
    #   All students Apr 16 -> 1:30 AM UTC Apr 17
    - cron: '*/5 * 12-17 4 *'
  workflow_dispatch:
    inputs:
      refresh_room_finder:
        description: Also refresh the active Fall 2026 room timetable
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: course-catalog-refresh
  cancel-in-progress: false

jobs:
  update-schedules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Chrome
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_room_finder
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Set up ChromeDriver
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_room_finder
        uses: nanasess/setup-chromedriver@v2

      - name: Install Python dependencies
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_room_finder
        working-directory: ./scraper
        run: |
          python -m pip install --upgrade pip
          pip install selenium python-dotenv

      - name: Export Spring 2027 for Schedule Builder
        run: |
          echo "Downloading NJIT public registration catalog..."
          for attempt in 1 2; do
            python scraper/registration_catalog.py --term 202710 --catalog-dir courseschedules && exit 0
            if [ "$attempt" -lt 2 ]; then
              echo "Import attempt $attempt failed; retrying in 60 seconds..."
              sleep 60
            fi
          done
          exit 1

      # Keep the active classroom semester separate from NJIT's default term.
      - name: Export Fall 2026 for Room Finder
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_room_finder
        # A failure in the legacy export must not prevent publishing Spring.
        continue-on-error: true
        working-directory: ./scraper
        run: |
          for attempt in 1 2; do
            python auto_update_scheduler.py --term 202690 --scrape-dir data/fall_scrape --catalog-dir ../courseschedules/202690 --workers 3 --no-backup && exit 0
            if [ "$attempt" -lt 2 ]; then
              echo "Fall scrape attempt $attempt failed; retrying in 60 seconds..."
              sleep 60
            fi
          done
          exit 1

      - name: Build frontend catalog assets
        run: python scripts/build_catalog_assets.py --expected-term 202710

      - name: Check for changes
        id: check_changes
        run: |
          git add courseschedules/ web/public/catalog/
          if git diff --cached --quiet courseschedules/ web/public/catalog/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add courseschedules/ web/public/catalog/
          git commit -m "Auto-update course schedules - $(date '+%Y-%m-%d %H:%M')"
          git push

      - name: Trigger API reload
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          API_URL: ${{ secrets.API_URL }}
          RELOAD_SECRET: ${{ secrets.RELOAD_SECRET }}
        run: |
          if [ -z "${API_URL}" ]; then
            echo "API_URL secret not set, skipping reload"
          else
            revision=$(git rev-parse HEAD)
            curl --fail-with-body --retry 3 --retry-delay 10 --max-time 180 \
              -X POST "${API_URL%/}/reload?revision=${revision}" \
              -H "X-Reload-Secret: ${RELOAD_SECRET}"
            echo "API catalog reloaded successfully"
          fi

      - name: No changes detected
        if: steps.check_changes.outputs.has_changes == 'false'
        run: echo "No changes to course schedules detected"

