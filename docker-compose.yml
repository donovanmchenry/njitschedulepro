version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./courseschedules:/app/courseschedules:ro
    environment:
      - PYTHONUNBUFFERED=1
      - RELOAD_SECRET=${RELOAD_SECRET:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - rate-limit-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://api:8000
    ports:
      - "3000:3000"
    environment:
      - API_PROXY_TARGET=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    name: njit-schedule-pro

volumes:
  rate-limit-data:
