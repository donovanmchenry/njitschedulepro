services:
  # Backend API
  - type: web
    name: njit-schedule-pro-api
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    buildCommand: "cd api && pip install poetry && poetry install --only main --no-root"
    startCommand: "cd api && poetry run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONUNBUFFERED
        value: 1
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: njit-schedule-pro-rate-limits
          property: connectionString
      - key: SOLVE_CONCURRENCY
        value: 1
    autoDeploy: true
    healthCheckPath: /

  - type: keyvalue
    name: njit-schedule-pro-rate-limits
    region: oregon
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

